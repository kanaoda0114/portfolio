# 自動テスト（Issue #22）
# push と Pull request のたびに、return_slip_ocr の pytest を GitHub 上で実行する。
# EasyOCR（PyTorch）は大きく、テストは偽の reader を使っていて不要なので入れない。
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: return_slip_ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: return_slip_ocr/requirements.txt
      - name: 依存を入れる（easyocr は除く）
        run: |
          grep -v -i easyocr requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: テストを実行
        run: python -m pytest -q
